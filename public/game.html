<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Fleet Invaders — Bus Pulse</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:#000;width:100%;height:100%;overflow:hidden;font-family:'Courier New',monospace;-webkit-tap-highlight-color:transparent}
  #gameCanvas{display:block;image-rendering:pixelated;position:absolute}
  #touchControls{display:none;position:fixed;inset:auto 0 0 0;height:96px;pointer-events:none;z-index:10}
  #joystickArea{position:absolute;left:18px;bottom:18px;width:120px;height:120px;border:2px solid rgba(166,255,0,0.55);border-radius:50%;background:rgba(166,255,0,0.05);pointer-events:all;touch-action:none}
  #joystickKnob{position:absolute;width:46px;height:46px;background:rgba(166,255,0,0.85);border-radius:50%;top:50%;left:50%;transform:translate(-50%,-50%);box-shadow:0 0 14px #A6FF00}
  #fireBtn{position:absolute;right:18px;bottom:18px;width:96px;height:96px;border:2px solid rgba(166,255,0,0.55);border-radius:50%;background:rgba(166,255,0,0.05);pointer-events:all;touch-action:none;display:flex;align-items:center;justify-content:center;color:rgba(166,255,0,0.85);font-size:12px;font-weight:bold;letter-spacing:1px}
  #fireBtn.active{background:rgba(166,255,0,0.25)}
  #autoBtn{position:absolute;right:18px;bottom:120px;width:56px;height:30px;border:1.5px solid rgba(166,255,0,0.5);border-radius:6px;background:rgba(0,0,0,0.4);pointer-events:all;color:rgba(166,255,0,0.75);font-size:9px;font-weight:bold;letter-spacing:1px;display:flex;align-items:center;justify-content:center}
  #autoBtn.on{background:rgba(166,255,0,0.25);color:#fff}
  #topBtns{position:fixed;top:8px;right:8px;display:none;gap:6px;z-index:11}
  #topBtns button{width:36px;height:36px;border:1.5px solid rgba(166,255,0,0.5);border-radius:6px;background:rgba(0,0,0,0.55);color:#A6FF00;font-family:inherit;font-size:14px;font-weight:bold}
  @media (pointer:coarse){#touchControls,#topBtns{display:flex}}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="touchControls">
  <div id="joystickArea"><div id="joystickKnob"></div></div>
  <div id="autoBtn">AUTO</div>
  <div id="fireBtn">FIRE</div>
</div>
<div id="topBtns"><button id="pauseBtn">II</button><button id="restartBtn">R</button></div>
<script>
'use strict';

/* ============================== CANVAS ============================== */
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');
const BASE_W=800, BASE_H=620;
let scale=1, offX=0, offY=0;
function resizeCanvas(){
  const ww=window.innerWidth, wh=window.innerHeight;
  scale=Math.min(ww/BASE_W, wh/BASE_H);
  canvas.width=Math.floor(BASE_W*scale);
  canvas.height=Math.floor(BASE_H*scale);
  offX=(ww-canvas.width)/2; offY=(wh-canvas.height)/2;
  canvas.style.left=offX+'px'; canvas.style.top=offY+'px';
}
resizeCanvas(); window.addEventListener('resize',resizeCanvas);

/* ============================== AUDIO =============================== */
let audioCtx=null, masterGain=null, musicGain=null, musicOn=true;
function getAudio(){
  if(!audioCtx){
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    masterGain=audioCtx.createGain(); masterGain.gain.value=0.6; masterGain.connect(audioCtx.destination);
    musicGain=audioCtx.createGain(); musicGain.gain.value=0.18; musicGain.connect(masterGain);
  }
  return audioCtx;
}
function envOsc(type,f0,f1,dur,vol,dest){
  const a=getAudio();
  const o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.setValueAtTime(f0,a.currentTime);
  if(f1!=null) o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),a.currentTime+dur);
  g.gain.setValueAtTime(vol,a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0008,a.currentTime+dur);
  o.connect(g); g.connect(dest||masterGain);
  o.start(); o.stop(a.currentTime+dur+0.02);
}
function noiseBurst(dur,vol,filt){
  const a=getAudio(); const buf=a.createBuffer(1,Math.floor(a.sampleRate*dur),a.sampleRate);
  const d=buf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length);
  const src=a.createBufferSource(); src.buffer=buf;
  const g=a.createGain(); g.gain.value=vol;
  const bp=a.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=filt||1200; bp.Q.value=0.8;
  src.connect(bp); bp.connect(g); g.connect(masterGain); src.start();
}
function sndShoot(){ try{envOsc('square',900,260,0.07,0.10); envOsc('triangle',1800,500,0.05,0.05);}catch(e){} }
function sndEnemyHit(){ try{envOsc('sawtooth',420,140,0.09,0.12); noiseBurst(0.06,0.08,2200);}catch(e){} }
function sndExplode(){ try{envOsc('sawtooth',220,40,0.32,0.22); noiseBurst(0.35,0.18,800);}catch(e){} }
function sndPowerup(){ try{[300,500,800].forEach((f,i)=>setTimeout(()=>envOsc('sine',f,f*1.4,0.18,0.18),i*55));}catch(e){} }
function sndGameOver(){ try{envOsc('sawtooth',400,60,1.0,0.28); noiseBurst(0.8,0.12,600);}catch(e){} }
function sndVictory(){ try{[400,500,600,800,1000].forEach((f,i)=>setTimeout(()=>envOsc('triangle',f,f*1.2,0.28,0.18),i*110));}catch(e){} }
function sndPlayerHit(){ try{envOsc('square',300,70,0.4,0.25); noiseBurst(0.35,0.2,400);}catch(e){} }
function sndEnemyMove(beat){ try{envOsc('square',[80,60,80,100][beat%4],null,0.05,0.05);}catch(e){} }
function sndBonusDrone(){ try{envOsc('sine',1400,900,0.18,0.16); envOsc('triangle',700,1400,0.18,0.08);}catch(e){} }
function sndCombo(n){ try{envOsc('sine',500+n*80,1100+n*80,0.14,0.18);}catch(e){} }
function sndComboBreak(){ try{envOsc('sawtooth',300,80,0.18,0.12);}catch(e){} }
function sndTelegraph(){ try{envOsc('square',180,180,0.15,0.08);}catch(e){} }

// Simple bass + arp music loop
let musicTimer=0, musicStep=0;
const MUSIC_BASS=[55,55,73,65,55,55,82,73]; // A1 patterns
const MUSIC_ARP=[220,329,440,329,247,370,494,370];
function tickMusic(dt){
  if(!audioCtx||!musicOn||gs===STATE.TITLE) return;
  musicTimer-=dt;
  if(musicTimer<=0){
    musicTimer = bossActive ? 0.18 : 0.24;
    const a=getAudio();
    envOsc('triangle', MUSIC_BASS[musicStep%8], MUSIC_BASS[musicStep%8], 0.22, 0.16, musicGain);
    if(musicStep%2===0) envOsc('square', MUSIC_ARP[musicStep%8], MUSIC_ARP[musicStep%8]*0.98, 0.16, 0.06, musicGain);
    if(bossActive && musicStep%4===0) envOsc('sawtooth', 41, 41, 0.35, 0.10, musicGain);
    musicStep++;
  }
}

/* ============================== PALETTE ============================= */
const C={ bg:'#000', lime:'#A6FF00', limeDim:'#4A7300', limeGlow:'#7CFF00', white:'#FFF',
  gray:'#2A2A2A', orange:'#FFB000', red:'#FF3030', yellow:'#FFFF00', blue:'#00BFFF', cyan:'#00FFFF' };

/* ============================== STATE =============================== */
const STATE={TITLE:0,PLAYING:1,PAUSED:2,GAMEOVER:3,VICTORY:4,WAVE_INTRO:5};
let gs=STATE.TITLE;
let score=0, displayScore=0, fleetHP=3, wave=1;
const TOTAL_WAVES=6;
let bossActive=false;
let combo=0, comboTimer=0, longestCombo=0;
let scorePopups=[];
let hiScore = Number(localStorage.getItem('fleetInvadersHi')||0);

// Stats for run summary
let stats={kills:0, shots:0, hits:0, powerups:0, startTime:0, waves:0};

// Overdrive (endless)
let overdrive=0; // 0 normal, 1+ each loop after wave 6

/* ============================== PLAYER ============================== */
const player={
  x:BASE_W/2, y:BASE_H-58, prevX:BASE_W/2, vx:0, tilt:0, recoil:0,
  w:96, h:38, speed:280, alive:true,
  shield:false, spread:false, turbo:false, rapid:false,
  powerTimer:0, powerType:null, invincible:0, muzzleFlash:0,
  exhaustTimer:0,
};

let playerBullets=[], enemyBullets=[], enemies=[];
let shields=[], particles=[], powerups=[], exhausts=[];
let bonusDrone=null, boss=null;
let stars1=[], stars2=[];
function initStars(){
  stars1=[]; stars2=[];
  for(let i=0;i<60;i++) stars1.push({x:Math.random()*BASE_W, y:Math.random()*BASE_H, s:1});
  for(let i=0;i<30;i++) stars2.push({x:Math.random()*BASE_W, y:Math.random()*BASE_H, s:1.8});
}
initStars();

/* ============================== INPUT =============================== */
const keys={};
let mouseX=BASE_W/2, mouseY=BASE_H/2, mousePressed=false, shootHeld=false, shootTimer=0;
let lastInput='key'; // 'key' | 'mouse' | 'touch'
let mouseMovedAt=0;

window.addEventListener('keydown',e=>{
  keys[e.code]=true; lastInput='key';
  if(e.code==='Space'){e.preventDefault(); shootHeld=true; tryShoot();}
  if(e.code==='KeyP'){togglePause();}
  if(e.code==='KeyM'){musicOn=!musicOn;}
  if(e.code==='KeyR'){restartGame();}
  if(e.code==='Enter'||e.code==='Space'){
    if(gs===STATE.TITLE) startGame();
    else if(gs===STATE.GAMEOVER||gs===STATE.VICTORY) restartGame();
    else if(gs===STATE.WAVE_INTRO) beginWave();
  }
});
window.addEventListener('keyup',e=>{keys[e.code]=false; if(e.code==='Space') shootHeld=false;});
window.addEventListener('blur',()=>{ if(gs===STATE.PLAYING) gs=STATE.PAUSED; });

canvas.addEventListener('mousemove',e=>{
  const r=canvas.getBoundingClientRect();
  const nx=(e.clientX-r.left)/scale;
  if(Math.abs(nx-mouseX)>0.5){ lastInput='mouse'; mouseMovedAt=performance.now(); }
  mouseX=nx; mouseY=(e.clientY-r.top)/scale;
});
canvas.addEventListener('mousedown',e=>{
  mousePressed=true; shootHeld=true; lastInput='mouse'; mouseMovedAt=performance.now();
  if(gs===STATE.TITLE) startGame();
  else if(gs===STATE.GAMEOVER||gs===STATE.VICTORY) restartGame();
  else if(gs===STATE.WAVE_INTRO) beginWave();
  else tryShoot();
});
canvas.addEventListener('mouseup',()=>{mousePressed=false; shootHeld=false;});

// Touch
const joystickArea=document.getElementById('joystickArea');
const joystickKnob=document.getElementById('joystickKnob');
const fireBtn=document.getElementById('fireBtn');
const autoBtn=document.getElementById('autoBtn');
const pauseBtn=document.getElementById('pauseBtn');
const restartBtn=document.getElementById('restartBtn');
let touchDirX=0, joystickActive=false, joystickStartX=0;
let autoFire=false;

function touchHandle(){
  if(gs===STATE.TITLE) startGame();
  else if(gs===STATE.GAMEOVER||gs===STATE.VICTORY) restartGame();
  else if(gs===STATE.WAVE_INTRO) beginWave();
}
joystickArea.addEventListener('touchstart',e=>{e.preventDefault(); lastInput='touch'; joystickActive=true; joystickStartX=e.touches[0].clientX; touchHandle();},{passive:false});
joystickArea.addEventListener('touchmove',e=>{
  e.preventDefault(); if(!joystickActive) return;
  const dx=e.touches[0].clientX-joystickStartX, maxD=40;
  touchDirX=Math.max(-1,Math.min(1,dx/maxD));
  joystickKnob.style.left=(50+touchDirX*30)+'%';
},{passive:false});
joystickArea.addEventListener('touchend',()=>{joystickActive=false; touchDirX=0; joystickKnob.style.left='50%';});
fireBtn.addEventListener('touchstart',e=>{e.preventDefault(); lastInput='touch'; shootHeld=true; fireBtn.classList.add('active'); tryShoot(); touchHandle();},{passive:false});
fireBtn.addEventListener('touchend',()=>{shootHeld=autoFire; fireBtn.classList.remove('active');});
autoBtn.addEventListener('touchstart',e=>{e.preventDefault(); autoFire=!autoFire; autoBtn.classList.toggle('on',autoFire); shootHeld=autoFire;},{passive:false});
pauseBtn.addEventListener('click',togglePause);
restartBtn.addEventListener('click',restartGame);

function togglePause(){
  if(gs===STATE.PLAYING) gs=STATE.PAUSED;
  else if(gs===STATE.PAUSED) gs=STATE.PLAYING;
}

/* ============================ FORMATION ============================= */
let formation={dx:60,dir:1,dropDist:20,beatTimer:0,beatInterval:0.7,moveBeat:0};
let diveTimer=4;

/* ============================== BUS DRAW ============================ */
function drawBus(x,y,alpha=1,tilt=0,recoil=0){
  ctx.save(); ctx.globalAlpha=alpha;
  ctx.translate(Math.round(x),Math.round(y+recoil));
  ctx.rotate(tilt);
  const BW=88,BH=36,HW=BW/2,HH=BH/2;
  ctx.fillStyle='rgba(166,255,0,0.06)';
  ctx.beginPath(); ctx.ellipse(0,HH+10,HW*0.9,7,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#0d1a00'; ctx.strokeStyle=C.lime; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.roundRect(-HW,-HH,BW,BH,5); ctx.fill(); ctx.stroke();
  ctx.fillStyle=C.lime; ctx.fillRect(-HW+4,-HH,BW-8,4);
  for(let i=0;i<4;i++){
    const wx=-HW+10+i*19;
    ctx.fillStyle='#1a3300'; ctx.strokeStyle=C.lime; ctx.lineWidth=1;
    ctx.fillRect(wx,-HH+7,15,11); ctx.strokeRect(wx,-HH+7,15,11);
    ctx.fillStyle='rgba(180,255,100,0.55)'; ctx.fillRect(wx+1,-HH+8,13,9);
    ctx.fillStyle='rgba(255,255,255,0.4)'; ctx.fillRect(wx+2,-HH+8,4,3);
  }
  ctx.strokeStyle=C.limeDim; ctx.lineWidth=1; ctx.strokeRect(-HW+3,2,BW-6,HH-5);
  ctx.fillStyle=C.limeDim; ctx.font='bold 7px Courier New'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('FLEET PULSE',0,9);
  ctx.fillStyle=C.yellow; ctx.shadowBlur=8; ctx.shadowColor=C.yellow;
  ctx.fillRect(HW-10,-HH+12,8,8); ctx.shadowBlur=0;
  ctx.fillStyle=C.red; ctx.fillRect(-HW+2,-HH+12,6,8);
  const wheelY=HH+2, spin=(player.x*0.08)%(Math.PI*2);
  [-28,-8,8,28].forEach(wx=>{
    ctx.fillStyle='#1a1a1a'; ctx.strokeStyle='#444'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(wx,wheelY,9,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.strokeStyle=C.lime; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(wx,wheelY,6,0,Math.PI*2); ctx.stroke();
    for(let b=0;b<5;b++){
      const ba=b*Math.PI*2/5+spin;
      ctx.fillStyle=C.lime;
      ctx.beginPath(); ctx.arc(wx+Math.cos(ba)*3.5,wheelY+Math.sin(ba)*3.5,1,0,Math.PI*2); ctx.fill();
    }
    ctx.fillStyle=C.lime; ctx.beginPath(); ctx.arc(wx,wheelY,2,0,Math.PI*2); ctx.fill();
  });
  // cannon
  ctx.fillStyle='#1a2e00'; ctx.strokeStyle=C.lime; ctx.lineWidth=2;
  ctx.fillRect(-12,-HH-8,24,10); ctx.strokeRect(-12,-HH-8,24,10);
  ctx.fillStyle='#0a1a00'; ctx.fillRect(-5,-HH-34+recoil*0.5,10,28); ctx.strokeRect(-5,-HH-34+recoil*0.5,10,28);
  ctx.fillStyle=C.lime; ctx.fillRect(-7,-HH-38+recoil*0.5,14,6);
  if(player.muzzleFlash>0){
    const fA=player.muzzleFlash/0.12;
    ctx.save(); ctx.globalAlpha=fA*alpha;
    ctx.shadowBlur=22; ctx.shadowColor=C.lime; ctx.fillStyle=C.lime;
    ctx.fillRect(-2,-HH-54,4,18); ctx.fillRect(-9,-HH-46,18,4);
    ctx.restore();
  }
  if(player.shield){
    const pulse=0.55+Math.sin(Date.now()*0.009)*0.45;
    ctx.strokeStyle=C.blue; ctx.lineWidth=2; ctx.globalAlpha=pulse*alpha;
    ctx.shadowBlur=14; ctx.shadowColor=C.blue;
    ctx.beginPath(); ctx.ellipse(0,0,HW+10,HH+16,0,0,Math.PI*2); ctx.stroke();
    ctx.shadowBlur=0;
  }
  ctx.restore();
}

/* ============================ ENEMY SPRITES ========================= */
function drawEngineInvader(x,y,t,af){
  ctx.save(); ctx.translate(Math.round(x),Math.round(y));
  ctx.scale(1, af===0?1:1.05);
  ctx.fillStyle='#0d1500'; ctx.strokeStyle=C.lime; ctx.lineWidth=2;
  ctx.fillRect(-16,-14,32,24); ctx.strokeRect(-16,-14,32,24);
  const pOff=af===0?0:3;
  ctx.fillStyle=C.orange; ctx.strokeStyle=C.orange; ctx.lineWidth=1.5;
  [-8,8].forEach(px=>{ctx.fillRect(px-4,-20+pOff,8,10); ctx.strokeRect(px-4,-20+pOff,8,10);});
  ctx.fillStyle='#fff'; [-8,8].forEach(px=>ctx.fillRect(px-4,-21+pOff,8,3));
  [-6,6].forEach(ex=>{
    ctx.fillStyle=C.orange; ctx.shadowBlur=5; ctx.shadowColor=C.orange;
    ctx.beginPath(); ctx.arc(ex,-4,4,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#000'; ctx.shadowBlur=0;
    ctx.beginPath(); ctx.arc(ex+1,-4,2,0,Math.PI*2); ctx.fill();
  });
  ctx.strokeStyle=C.limeDim; ctx.lineWidth=1;
  for(let i=-10;i<=10;i+=7){ctx.beginPath(); ctx.moveTo(i,2); ctx.lineTo(i,8); ctx.stroke();}
  ctx.restore();
}
function drawTransmission(x,y,t,af){
  ctx.save(); ctx.translate(Math.round(x),Math.round(y));
  ctx.rotate(af*0.4 + t*0.5);
  ctx.strokeStyle=C.lime; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.arc(0,0,14,0,Math.PI*2); ctx.stroke();
  for(let i=0;i<8;i++){const a=i*Math.PI/4; ctx.save(); ctx.rotate(a); ctx.fillStyle=C.lime; ctx.fillRect(-3,11,6,6); ctx.restore();}
  ctx.strokeStyle=C.limeDim; ctx.lineWidth=1.5;
  for(let i=0;i<4;i++){const a=i*Math.PI/2; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(a)*11,Math.sin(a)*11); ctx.stroke();}
  ctx.fillStyle=C.orange; ctx.beginPath(); ctx.arc(0,0,6,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#000'; ctx.beginPath(); ctx.arc(0,0,2.5,0,Math.PI*2); ctx.fill();
  ctx.restore();
}
function drawOilBarrel(x,y,t,af){
  ctx.save(); ctx.translate(Math.round(x),Math.round(y));
  ctx.scale(1, af===0?1:1.04);
  ctx.fillStyle='#111'; ctx.strokeStyle=C.orange; ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(-12,-14); ctx.lineTo(12,-14);
  ctx.quadraticCurveTo(16,-14,16,-10); ctx.lineTo(16,10);
  ctx.quadraticCurveTo(16,14,12,14); ctx.lineTo(-12,14);
  ctx.quadraticCurveTo(-16,14,-16,10); ctx.lineTo(-16,-10);
  ctx.quadraticCurveTo(-16,-14,-12,-14); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.strokeStyle=C.limeDim; ctx.lineWidth=1.5;
  [-8,0,8].forEach(ry=>{ctx.beginPath(); ctx.moveTo(-16,ry); ctx.lineTo(16,ry); ctx.stroke();});
  ctx.fillStyle=C.orange; ctx.font='bold 8px Courier New'; ctx.textAlign='center'; ctx.fillText('OIL',0,2);
  [-5,5].forEach(ex=>{
    ctx.fillStyle=C.orange; ctx.shadowBlur=5; ctx.shadowColor=C.orange;
    ctx.beginPath(); ctx.arc(ex,-5,3,0,Math.PI*2); ctx.fill();
  });
  ctx.shadowBlur=0;
  ctx.restore();
}
function drawWrench(x,y,t,af){
  ctx.save(); ctx.translate(Math.round(x),Math.round(y));
  ctx.rotate(af===0?-0.2:0.2);
  ctx.strokeStyle=C.lime; ctx.lineWidth=3; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(0,16); ctx.lineTo(0,-8); ctx.stroke();
  ctx.beginPath(); ctx.arc(0,-12,10,Math.PI*0.15,Math.PI*0.85); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-9,-12); ctx.lineTo(-14,-5);
  ctx.moveTo(9,-12); ctx.lineTo(14,-5); ctx.stroke();
  ctx.fillStyle=C.lime; [[-14,-5],[14,-5]].forEach(([jx,jy])=>{ctx.beginPath(); ctx.arc(jx,jy,3.5,0,Math.PI*2); ctx.fill();});
  ctx.fillStyle=C.orange; ctx.beginPath(); ctx.arc(0,2,5,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#000'; ctx.beginPath(); ctx.arc(0,2,2,0,Math.PI*2); ctx.fill();
  ctx.restore();
}
function drawZeroDrone(x,y,t,af){
  ctx.save(); ctx.translate(Math.round(x),Math.round(y));
  ctx.shadowBlur=16; ctx.shadowColor=C.cyan;
  ctx.strokeStyle=C.cyan; ctx.lineWidth=3;
  ctx.beginPath(); ctx.ellipse(0,0,14,17,0,0,Math.PI*2); ctx.stroke();
  ctx.strokeStyle='#000'; ctx.lineWidth=6;
  ctx.beginPath(); ctx.ellipse(0,0,8,11,0,0,Math.PI*2); ctx.stroke();
  ctx.strokeStyle=C.cyan; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.ellipse(0,0,8,11,0,0,Math.PI*2); ctx.stroke();
  ctx.shadowBlur=0;
  ctx.fillStyle=C.lime;
  for(let i=0;i<3;i++){const a=t*2.5+i*Math.PI*2/3; ctx.beginPath(); ctx.arc(Math.cos(a)*20,Math.sin(a)*6,3,0,Math.PI*2); ctx.fill();}
  ctx.fillStyle=af===0?C.cyan:C.yellow;
  ctx.font='bold 10px Courier New'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('0',0,0);
  ctx.restore();
}

/* ============================== BOSS ================================ */
function drawBoss(b,t){
  if(!b) return;
  ctx.save(); ctx.translate(Math.round(b.x+b.shakeX||b.x), Math.round(b.y));
  if(b.hitFlash>0){ ctx.shadowBlur=35; ctx.shadowColor='#fff'; }
  const phaseColor = b.phase===3 ? C.red : b.phase===2 ? C.orange : C.red;
  ctx.fillStyle='#0d0d0d'; ctx.strokeStyle=phaseColor; ctx.lineWidth=3;
  ctx.fillRect(-70,-38,140,72); ctx.strokeRect(-70,-38,140,72);
  ctx.strokeStyle='#1a0000'; ctx.lineWidth=1;
  for(let px=-60;px<=60;px+=20){ctx.beginPath(); ctx.moveTo(px,-38); ctx.lineTo(px,34); ctx.stroke();}
  ctx.strokeStyle=C.orange; ctx.lineWidth=3.5; ctx.lineCap='round';
  [-55,-22,22,55].forEach(ax=>{
    const ah=12+Math.sin(t*3+ax)*7;
    ctx.beginPath(); ctx.moveTo(ax,34); ctx.lineTo(ax,34+ah); ctx.stroke();
    ctx.fillStyle=C.orange; ctx.fillRect(ax-5,34+ah,10,5);
  });
  const blink=Math.sin(t*9)>0;
  ctx.shadowBlur=blink?18:4; ctx.shadowColor=C.red;
  ctx.fillStyle=blink?C.red:'#500';
  [-52,52].forEach(wx=>{ctx.beginPath(); ctx.arc(wx,-24,9,0,Math.PI*2); ctx.fill();});
  ctx.shadowBlur=0;
  [-38,-10,18].forEach(px=>{
    ctx.fillStyle='#050505'; ctx.strokeStyle=C.limeDim; ctx.lineWidth=1;
    ctx.fillRect(px,-22,22,16); ctx.strokeRect(px,-22,22,16);
    ctx.fillStyle=C.limeDim; ctx.font='6px Courier New'; ctx.textAlign='center'; ctx.fillText('ERR',px+11,-10);
  });
  // Telegraph slam zones (phase 2+)
  if(b.slamTele>0){
    ctx.fillStyle=`rgba(255,100,0,${0.25+0.4*Math.sin(b.slamTele*30)})`;
    b.slamZones.forEach(zx=>ctx.fillRect(zx-30,BASE_H-b.y-110,60,80));
  }
  b.weakPoints.forEach(wp=>{
    const wx=wp.localX, wy=wp.localY;
    const pulse=Math.sin(t*6)*0.3+0.7;
    ctx.fillStyle=wp.alive?C.lime:'#1a1a1a';
    ctx.strokeStyle=wp.alive?C.lime:'#333';
    ctx.lineWidth=2.5;
    if(wp.alive){ctx.shadowBlur=10*pulse; ctx.shadowColor=C.lime;}
    ctx.beginPath(); ctx.arc(wx,wy,10,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.shadowBlur=0;
    if(wp.alive){ctx.fillStyle='#000'; ctx.font='bold 9px Courier New'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('!',wx,wy);}
  });
  ctx.restore();

  // Top-of-screen boss HP bar
  const barX=60, barY=44, barW=BASE_W-120, barH=14;
  ctx.fillStyle='#1a0000'; ctx.fillRect(barX,barY,barW,barH);
  const ratio=b.hp/b.maxHP;
  const col = ratio>0.66 ? C.lime : ratio>0.33 ? C.orange : C.red;
  ctx.fillStyle=col; ctx.shadowBlur=10; ctx.shadowColor=col;
  ctx.fillRect(barX,barY,barW*ratio,barH); ctx.shadowBlur=0;
  ctx.strokeStyle=C.red; ctx.lineWidth=1.5; ctx.strokeRect(barX,barY,barW,barH);
  // Phase ticks
  ctx.strokeStyle='#000'; ctx.lineWidth=2;
  [0.33,0.66].forEach(p=>{ctx.beginPath(); ctx.moveTo(barX+barW*p,barY); ctx.lineTo(barX+barW*p,barY+barH); ctx.stroke();});
  ctx.fillStyle=C.red; ctx.font='bold 11px Courier New'; ctx.textAlign='center';
  ctx.fillText('BROKEN ELEVATOR — PHASE '+b.phase, BASE_W/2, barY-4);
}

function createShields(){

    [0,1,1,1,1,1,0],

function drawShields(){
  shields.forEach(s=>{
    if(s.hp<=0) return;
    const ratio=s.hp/s.maxHp;
    ctx.globalAlpha=0.35+ratio*0.65;
    ctx.fillStyle=ratio>0.66?'#1a3300':ratio>0.33?'#0f2000':'#0a1200';
    ctx.strokeStyle=ratio>0.66?C.lime:ratio>0.33?C.orange:C.red;
    ctx.lineWidth=1.5;

  });

}

function setupEnemies(waveNum){
  enemies=[];
  const cols=10, rows=4;
  const waveTypes=[
    ['engine','engine','engine','engine'],
    ['transmission','engine','transmission','engine'],
    ['oil','transmission','engine','oil'],
    ['wrench','oil','transmission','engine'],
    ['zero','wrench','oil','transmission'],
  ];
  // Overdrive randomizes
  let types;
  if(overdrive>0){
    const pool=['engine','transmission','oil','wrench','zero'];
    types=[0,0,0,0].map(()=>pool[Math.floor(Math.random()*pool.length)]);
  } else {
    types=waveTypes[Math.min(waveNum-1,4)];
  }
  const startX=80, startY=75, spacX=60, spacY=46;
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    enemies.push({
      type:types[r], x:startX+c*spacX, y:startY+r*spacY,
      formX:startX+c*spacX, formY:startY+r*spacY,
      alive:true, t:Math.random()*Math.PI*2,
      shotTimer:1.5+Math.random()*4, row:r, col:c,
      animFrame:0, deathFlash:0,
      diving:false, diveT:0, diveStart:null, diveCtrl:null, diveEnd:null, diveDur:2.0,
      telegraph:0,
    });
  }
  formation.dir=1;
  formation.dx = 40 + waveNum*9 + overdrive*15;
  formation.beatInterval = Math.max(0.35, 0.7 - overdrive*0.05);
  formation.beatTimer=0; formation.moveBeat=0;
  diveTimer = 6;
}

/* ============================== POWERUPS ============================ */
const POWERUP_TYPES=['turbo','rapid','shield','spread','repair','bomb'];
const POWERUP_LABELS={turbo:'TURBO',rapid:'RAPID',shield:'SHLD',spread:'SPRD',repair:'RPRR',bomb:'BOMB'};
const POWERUP_COLORS={turbo:C.cyan,rapid:C.lime,shield:C.blue,spread:C.orange,repair:C.yellow,bomb:C.red};
function spawnPowerup(x,y,force=false){
  const chance = force ? 1 : 0.30;
  if(Math.random()<chance){
    // Bias early waves toward defense
    let pool=POWERUP_TYPES.slice();
    if(fleetHP<=1 && Math.random()<0.5){ pool=['repair','shield']; }
    powerups.push({x,y,type:pool[Math.floor(Math.random()*pool.length)],vy:55,life:9,t:0});
  }
}
function applyPowerup(type){
  sndPowerup(); stats.powerups++;
  if(type==='bomb'){
    // Clear enemy bullets and damage all
    enemyBullets.forEach(b=>spawnExplosion(b.x,b.y,C.red,4));
    enemyBullets=[];
    enemies.forEach(e=>{if(e.alive){e.deathFlash=0.15;}});
    setTimeout(()=>{
      enemies.forEach(e=>{
        if(!e.alive) return;
        e.alive=false; spawnFlash(e.x,e.y,18); spawnExplosion(e.x,e.y,C.lime,10);
        score+=getPoints(e.type); stats.kills++;
      });
      if(bossActive&&boss){ boss.hp-=15; boss.hitFlash=1; }
      shake(10);
    },150);
    return;
  }
  player.powerType=type; player.powerTimer=8;
  if(type==='turbo')  player.turbo=true;
  if(type==='rapid')  player.rapid=true;
  if(type==='shield') player.shield=true;
  if(type==='spread') player.spread=true;
  if(type==='repair'){
    fleetHP=Math.min(3,fleetHP+1);
    // Also restore some shields
    shields.forEach(s=>{ if(s.hp<s.maxHp && Math.random()<0.4) s.hp=s.maxHp; });
    player.powerType=null; player.powerTimer=0;
  }
}
function clearPowerup(){ player.turbo=player.rapid=player.shield=player.spread=false; player.powerType=null; }

function drawPowerup(p){
  ctx.save(); ctx.translate(Math.round(p.x),Math.round(p.y));
  const col=POWERUP_COLORS[p.type]||C.lime;

  ctx.fillStyle=col; ctx.font='bold 8px Courier New'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(POWERUP_LABELS[p.type]||'?',0,0);

}

/* ============================== COLLISION =========================== */
function circleRect(cx,cy,cr,rx,ry,rw,rh){
  const nx=Math.max(rx,Math.min(cx,rx+rw));
  const ny=Math.max(ry,Math.min(cy,ry+rh));
  const dx=cx-nx, dy=cy-ny;
  return dx*dx+dy*dy<cr*cr;
}
function rectOverlap(ax,ay,aw,ah,bx,by,bw,bh){
  return ax<bx+bw&&ax+aw>bx&&ay<by+bh&&ay+ah>by;
}

/* ============================== UPDATE ============================== */
let lastTime=0;
let starScroll1=0, starScroll2=0;
function update(dt){
  tickMusic(dt);
  starScroll1 += 8*dt; starScroll2 += 22*dt;
  if(gs===STATE.WAVE_INTRO){ waveIntroTimer-=dt; if(waveIntroTimer<=0) beginWave(); return; }
  if(gs!==STATE.PLAYING) return;
  const t=performance.now()*0.001;

  // Score tween
  if(displayScore<score){ displayScore += Math.max(1, Math.ceil((score-displayScore)*dt*8)); if(displayScore>score) displayScore=score; }

  // Shake
  if(shakeAmt>0){ shakeAmt*=0.78; shakeX=(Math.random()-0.5)*shakeAmt*8; shakeY=(Math.random()-0.5)*shakeAmt*8; if(shakeAmt<0.3){shakeAmt=0;shakeX=0;shakeY=0;} }

  // Decay flash / recoil / muzzle
  if(player.muzzleFlash>0) player.muzzleFlash=Math.max(0,player.muzzleFlash-dt);
  player.recoil = Math.max(0, player.recoil - dt*40);

  // Player movement (last-input-wins)
  if(player.alive){
    const spd=player.turbo?player.speed*1.65:player.speed;
    player.prevX = player.x;
    let moved=false;
    if(keys['ArrowLeft']||keys['KeyA']){ player.x-=spd*dt; moved=true; lastInput='key'; }
    if(keys['ArrowRight']||keys['KeyD']){ player.x+=spd*dt; moved=true; lastInput='key'; }
    if(touchDirX!==0){ player.x+=touchDirX*spd*dt; moved=true; lastInput='touch'; }
    if(!moved && lastInput==='mouse' && (performance.now()-mouseMovedAt)<1500){
      if(Math.abs(mouseX-player.x)>2) player.x += (mouseX-player.x)*Math.min(1, 16*dt);
    }
    player.x=Math.max(48,Math.min(BASE_W-48,player.x));
    player.vx = (player.x - player.prevX)/Math.max(dt,1e-3);
    // Tilt
    const targetTilt = Math.max(-0.08, Math.min(0.08, player.vx*0.0005));
    player.tilt += (targetTilt - player.tilt)*Math.min(1,10*dt);
    // Exhaust
    if(Math.abs(player.vx)>40){
      player.exhaustTimer-=dt;
      if(player.exhaustTimer<=0){
        player.exhaustTimer=0.05;
        const dir = player.vx>0 ? -1 : 1;
        exhausts.push({x:player.x+dir*30, y:player.y+18, vx:dir*30+(Math.random()-0.5)*20, vy:10+Math.random()*15, life:0.5, maxLife:0.5, size:3+Math.random()*2});
      }
    }
  }

  shootCooldown=Math.max(0,shootCooldown-dt);
  if(shootHeld&&shootCooldown<=0) tryShoot();
  if(player.powerTimer>0){ player.powerTimer-=dt; if(player.powerTimer<=0) clearPowerup(); }
  if(player.invincible>0) player.invincible-=dt;

  // Combo timer
  if(comboTimer>0){
    comboTimer-=dt;
    if(comboTimer<=0){
      if(combo>=3) sndComboBreak();
      combo=0;
    }
  }

  // Exhausts
  exhausts=exhausts.filter(p=>{p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt; return p.life>0;});

  // Score popups
  scorePopups=scorePopups.filter(p=>{ p.y+=p.vy*dt; p.life-=dt; return p.life>0; });

  // Player bullets
  playerBullets=playerBullets.filter(b=>{
    b.trail=b.trail||[];
    b.trail.push({x:b.x,y:b.y});
    if(b.trail.length>12) b.trail.shift();
    b.x+=b.vx*dt; b.y+=b.vy*dt;
    return b.y>-10&&b.y<BASE_H&&b.x>0&&b.x<BASE_W;
  });

  // Enemy bullets
  enemyBullets=enemyBullets.filter(b=>{
    b.x+=b.vx*dt; b.y+=b.vy*dt;
    if(b.y>BASE_H||b.y<0) return false;
    if(player.alive&&player.invincible<=0&&circleRect(b.x,b.y,7,player.x-44,player.y-18,88,36)){
      if(player.shield){ player.shield=false; player.powerType=null; spawnExplosion(b.x,b.y,C.blue,8); }
      else{
        fleetHP--; sndPlayerHit(); shake(5);
        spawnExplosion(player.x,player.y,C.red,20); spawnFlash(player.x,player.y,28);
        player.invincible=1.6;
        if(fleetHP<=0){gs=STATE.GAMEOVER; sndGameOver(); saveHi();}
        else{
          // soft recovery
          setTimeout(()=>{ if(gs===STATE.PLAYING) spawnPowerup(BASE_W/2,80,true); }, 1500);
        }
      }
      return false;
    }
    for(let s of shields){
      if(s.hp<=0) continue;
      if(rectOverlap(b.x-4,b.y-4,8,8,s.x,s.y,s.w,s.h)){
        s.hp--; spawnShieldChunk(b.x,b.y); return false;
      }
    }
    return true;
  });

  // Enemy fire rate scales with wave + overdrive
  const waveFireScale = Math.max(0.4, 1 - wave*0.10 - overdrive*0.08);

  // Formation movement
  const aliveList=enemies.filter(e=>e.alive && !e.diving);
  const allAlive=enemies.filter(e=>e.alive);
  if(allAlive.length>0){
    const total=40;
    const speedMult=1+(1-allAlive.length/total)*3;
    const effDx=formation.dx*speedMult;
    formation.beatInterval=Math.max(0.06,(0.7 - overdrive*0.05)/speedMult);
    formation.beatTimer+=dt;
    if(formation.beatTimer>=formation.beatInterval){
      formation.beatTimer=0; formation.moveBeat++;
      sndEnemyMove(formation.moveBeat);
    }
    const animFrame=formation.moveBeat%2;
    enemies.forEach(e=>{
      if(!e.alive) return;
      if(e.diving){
        e.diveT += dt/e.diveDur;
        if(e.diveT>=1){
          // Return to formation if survived
          e.diving=false; e.x=e.formX; e.y=e.formY;
        } else {
          // Quadratic bezier
          const u=1-e.diveT;
          e.x = u*u*e.diveStart.x + 2*u*e.diveT*e.diveCtrl.x + e.diveT*e.diveT*e.diveEnd.x;
          e.y = u*u*e.diveStart.y + 2*u*e.diveT*e.diveCtrl.y + e.diveT*e.diveT*e.diveEnd.y;
        }
      } else {
        e.x+=effDx*formation.dir*dt;
      }
      e.t+=dt; e.animFrame=animFrame;
      if(e.deathFlash>0) e.deathFlash-=dt;
      if(e.telegraph>0) e.telegraph-=dt;
    });
    let minX=9999,maxX=-9999;
    aliveList.forEach(e=>{ minX=Math.min(minX,e.x); maxX=Math.max(maxX,e.x); });
    if(maxX>BASE_W-44&&formation.dir>0){ formation.dir=-1; aliveList.forEach(e=>{e.y+=formation.dropDist; e.formY=e.y;}); }
    if(minX<44&&formation.dir<0){ formation.dir=1; aliveList.forEach(e=>{e.y+=formation.dropDist; e.formY=e.y;}); }
    const maxY=Math.max(...allAlive.map(e=>e.y));
    if(maxY>=BASE_H-80){ gs=STATE.GAMEOVER; sndGameOver(); saveHi(); }

    // Enemy shooting (telegraph on bottom row)
    allAlive.forEach(e=>{
      e.shotTimer-=dt;
      if(e.shotTimer<=0){
        e.shotTimer = (1.2 + Math.random()*3) * waveFireScale;
        const sameCol=allAlive.filter(a=>a.col===e.col);
        const bot=sameCol.sort((a,b)=>b.y-a.y)[0];
        if(e===bot && Math.random()<0.65){
          e.telegraph = 0.25;
          setTimeout(()=>{
            if(!e.alive) return;
            let vx=0, vy=190 + wave*8 + overdrive*20;
            if(e.type==='wrench') vx=(Math.random()-0.5)*90;
            if(e.type==='zero') vy+=50;
            if(e.type==='oil') vy*=0.85;
            enemyBullets.push({x:e.x,y:e.y+14,vx,vy,type:e.type});
          }, 250);
        }
      }
    });

    // DIVE BOMBS (wave 2+, not on boss wave)
    if(wave>=2 && !bossActive){
      diveTimer-=dt;
      if(diveTimer<=0){
        diveTimer = 5 + Math.random()*4 - overdrive*0.5;
        const candidates = enemies.filter(e=>e.alive && !e.diving);
        const n = Math.min(candidates.length, 1 + Math.floor(Math.random()*Math.min(3, wave-1)));
        for(let i=0;i<n;i++){
          const e = candidates[Math.floor(Math.random()*candidates.length)];
          if(!e || e.diving) continue;
          e.formX = e.x; e.formY = e.y;
          e.diving = true; e.diveT = 0; e.diveDur = 2.0 + Math.random()*0.6;
          const targetX = player.x + (Math.random()-0.5)*100;
          e.diveStart = {x:e.x, y:e.y};
          e.diveCtrl  = {x: e.x + (targetX-e.x)*0.5 + (Math.random()-0.5)*200, y: BASE_H*0.6};
          e.diveEnd   = {x: targetX, y: BASE_H+40};
          // shoot mid-dive
          setTimeout(()=>{
            if(e.alive && e.diving){
              const dx=player.x-e.x, dy=player.y-e.y, d=Math.hypot(dx,dy)||1;
              enemyBullets.push({x:e.x,y:e.y+10,vx:dx/d*220,vy:dy/d*220,type:'dive'});
            }
          }, 700);
        }
      }
    }
  }

  // Diving enemies hit player on contact
  enemies.forEach(e=>{
    if(!e.alive || !e.diving) return;
    if(player.alive && player.invincible<=0 && circleRect(e.x,e.y,18, player.x-44, player.y-18, 88,36)){
      if(player.shield){ player.shield=false; player.powerType=null; spawnExplosion(e.x,e.y,C.blue,10); }
      else{ fleetHP--; sndPlayerHit(); shake(7); spawnExplosion(player.x,player.y,C.red,24); spawnFlash(player.x,player.y,30);
        player.invincible=1.6;
        if(fleetHP<=0){gs=STATE.GAMEOVER; sndGameOver(); saveHi();}
      }
      e.alive=false; spawnFlash(e.x,e.y,16); spawnExplosion(e.x,e.y,C.lime,16);
    }
    // Off-screen diving = lost
    if(e.diving && (e.y>BASE_H+30 || e.x<-30 || e.x>BASE_W+30)){
      e.alive=false;
    }
  });

  // Player bullets vs enemies
  playerBullets=playerBullets.filter(pb=>{
    let hit=false;
    for(let e of enemies){
      if(!e.alive) continue;
      if(circleRect(pb.x,pb.y,6,e.x-18,e.y-18,36,32)){
        e.alive=false; hit=true;
        const pts=getPoints(e.type);
        combo++; comboTimer=2.6;
        if(combo>longestCombo) longestCombo=combo;
        score+=pts*(combo>1?combo:1);
        spawnFlash(e.x,e.y,18);
        spawnExplosion(e.x,e.y,C.lime,14);
        spawnPowerup(e.x,e.y);
        spawnScorePopup(e.x,e.y-20,pts,combo>1?combo:1);
        sndEnemyHit();
        stats.kills++; stats.hits++;
        if(combo===5) bigCallout('TUNE-UP!', C.yellow);
        else if(combo===10) bigCallout('OVERHAUL!', C.orange);
        else if(combo===20) bigCallout('FULL SERVICE!', C.red);
        if(combo>=3) sndCombo(combo);
        if(combo>0 && combo%10===0) spawnPowerup(e.x,e.y,true);
        if(enemies.filter(en=>en.alive).length===0) setTimeout(()=>nextWave(),1200);
        break;
      }
    }
    if(!hit){
      for(let s of shields){
        if(s.hp<=0) continue;
        if(rectOverlap(pb.x-3,pb.y-6,6,12,s.x,s.y,s.w,s.h)){
          s.hp--; hit=true; spawnShieldChunk(pb.x,pb.y); break;
        }
      }
    }
    return !hit;
  });

  // BOSS
  if(bossActive&&boss){
    boss.t+=dt; boss.hitFlash=Math.max(0,boss.hitFlash-dt*5);
    boss.shakeX = boss.hitFlash>0 ? (Math.random()-0.5)*8 : 0;
    // Phase transitions
    const newPhase = boss.hp <= boss.maxHP*0.33 ? 3 : boss.hp <= boss.maxHP*0.66 ? 2 : 1;
    if(newPhase !== boss.phase){
      boss.phase = newPhase;
      bigCallout('PHASE '+newPhase, newPhase===3?C.red:C.orange);
      shake(8); spawnFlash(boss.x,boss.y,40);
      if(newPhase===3) boss.vx = Math.sign(boss.vx||1)*140;
      if(newPhase===2) boss.vx = Math.sign(boss.vx||1)*90;
    }
    boss.x+=boss.vx*dt;
    if(boss.x>BASE_W-85||boss.x<85) boss.vx*=-1;

    boss.shootTimer-=dt;
    if(boss.shootTimer<=0){
      const p=boss.phase;
      boss.shootTimer = p===1 ? 1.05 : p===2 ? 0.75 : 0.55;
      const n = p===1 ? 3 : p===2 ? 5 : 7;
      for(let i=0;i<n;i++){
        const a=-Math.PI/2+(i-(n-1)/2)*0.28;
        enemyBullets.push({x:boss.x,y:boss.y+44,vx:Math.cos(a)*170,vy:Math.abs(Math.sin(a))*160+150,type:'boss'});
      }
      // Phase 3 aimed shot
      if(p===3 && player.alive){
        const dx=player.x-boss.x, dy=player.y-boss.y, d=Math.hypot(dx,dy)||1;
        enemyBullets.push({x:boss.x,y:boss.y+30,vx:dx/d*260,vy:dy/d*260,type:'boss'});
      }
    }
    // Part drop (phase 1+)
    boss.partDropTimer -= dt;
    if(boss.partDropTimer<=0){
      boss.partDropTimer = boss.phase===1 ? 8 : 6;
      enemies.push({
        type:'transmission', x:boss.x, y:boss.y+50,
        formX:boss.x, formY:boss.y+50, alive:true, t:0, shotTimer:99, row:-1, col:-1,
        animFrame:0, deathFlash:0, telegraph:0,
        diving:true, diveT:0, diveDur:2.2,
        diveStart:{x:boss.x,y:boss.y+50},
        diveCtrl:{x:boss.x+(Math.random()-0.5)*200, y:BASE_H*0.55},
        diveEnd:{x:player.x, y:BASE_H+30},
      });
    }
    // Phase 2 slam telegraph + damage
    if(boss.phase>=2){
      boss.slamCooldown -= dt;
      if(boss.slamCooldown<=0 && boss.slamTele<=0){
        boss.slamCooldown = 7;
        boss.slamTele = 1.0;
        boss.slamZones = [boss.x-80, boss.x+80];
        sndTelegraph();
      }
      if(boss.slamTele>0){
        boss.slamTele -= dt;
        if(boss.slamTele<=0){
          // Damage zone
          boss.slamZones.forEach(zx=>{
            if(player.alive && player.invincible<=0 && Math.abs(player.x-zx)<40){
              fleetHP--; sndPlayerHit(); shake(10);
              spawnExplosion(player.x,player.y,C.red,30); player.invincible=1.6;
              if(fleetHP<=0){gs=STATE.GAMEOVER; sndGameOver(); saveHi();}
            }
            spawnExplosion(zx, BASE_H-80, C.orange, 18);
            shake(6);
          });
          boss.slamZones=[];
        }
      }
    }
    // Phase 3 spawn drones
    if(boss.phase===3){
      boss.droneSpawnTimer -= dt;
      if(boss.droneSpawnTimer<=0){
        boss.droneSpawnTimer = 7;
        [-1,1].forEach(s=>{
          enemies.push({
            type:'zero', x:boss.x+s*70, y:boss.y+10,
            formX:boss.x+s*70, formY:boss.y+10, alive:true, t:0,
            shotTimer:1.5, row:-1, col:-1, animFrame:0, deathFlash:0, telegraph:0,
            diving:true, diveT:0, diveDur:3.0,
            diveStart:{x:boss.x+s*70,y:boss.y+10},
            diveCtrl:{x:boss.x+s*200, y:BASE_H*0.5},
            diveEnd:{x:Math.max(60,Math.min(BASE_W-60, player.x+s*100)), y:BASE_H+30},
          });
        });
      }
    }

    // Bullets vs boss
    playerBullets=playerBullets.filter(pb=>{
      if(!bossActive||!boss) return true;
      let hit=false;
      boss.weakPoints.forEach(wp=>{
        if(!wp.alive) return;
        const wx=boss.x+wp.localX,wy=boss.y+wp.localY;
        if(circleRect(pb.x,pb.y,6,wx-10,wy-10,20,20)){
          wp.alive=false; boss.hp-=12; boss.hitFlash=1; hit=true; stats.hits++;
          sndEnemyHit(); spawnExplosion(wx,wy,C.red,14); shake(3);
          spawnScorePopup(wx,wy-20,50); score+=50;
          setTimeout(()=>{ if(boss&&boss.hp>0) wp.alive=true; },3500);
        }
      });
      if(!hit&&circleRect(pb.x,pb.y,6,boss.x-70,boss.y-38,140,76)){
        boss.hp-=2; boss.hitFlash=0.4; hit=true; stats.hits++;
        sndEnemyHit(); spawnExplosion(pb.x,pb.y,C.orange,5);
      }
      if(boss.hp<=0){
        bossDefeatSequence();
      }
      return !hit;
    });
  }

  // Bonus drone
  droneTimer+=dt;
  if(droneTimer>droneInterval&&!bonusDrone){ droneTimer=0; droneInterval=12+Math.random()*14; spawnDrone(); }
  if(bonusDrone){
    bonusDrone.x+=bonusDrone.vx*dt; bonusDrone.t+=dt;
    if(bonusDrone.x<-70||bonusDrone.x>BASE_W+70) bonusDrone=null;
  }
  if(bonusDrone){
    playerBullets=playerBullets.filter(pb=>{
      if(!bonusDrone) return true;
      if(circleRect(pb.x,pb.y,6,bonusDrone.x-26,bonusDrone.y-12,52,18)){
        score+=150; sndBonusDrone(); spawnExplosion(bonusDrone.x,bonusDrone.y,C.yellow,16);
        spawnScorePopup(bonusDrone.x,bonusDrone.y-20,150); bonusDrone=null; return false;
      }
      return true;
    });
  }

  // Powerups
  powerups=powerups.filter(p=>{
    p.y+=p.vy*dt; p.t+=dt; p.life-=dt;
    if(p.life<=0) return false;
    if(player.alive&&circleRect(player.x,player.y,32,p.x-16,p.y-11,32,22)){ applyPowerup(p.type); return false; }
    return true;
  });

  // Particles
  particles=particles.filter(p=>{
    if(p.type==='flash'){ p.size += 80*dt; p.life-=dt; return p.life>0; }
    p.x+=p.vx*dt; p.y+=p.vy*dt;
    if(p.type==='spark') p.vy+=90*dt;
    p.life-=dt; return p.life>0;
  });
}

function bossDefeatSequence(){
  if(!boss) return;
  const bx=boss.x, by=boss.y;
  spawnExplosion(bx,by,C.red,60); spawnFlash(bx,by,60); shake(14); sndExplode();
  // chained explosions
  for(let i=0;i<10;i++){
    setTimeout(()=>{
      spawnExplosion(bx+(Math.random()-0.5)*120, by+(Math.random()-0.5)*60, [C.red,C.orange,C.yellow][i%3], 22);
      spawnFlash(bx+(Math.random()-0.5)*120, by+(Math.random()-0.5)*60, 20);
      shake(6);
      sndExplode();
    }, i*100);
  }
  score+=1500;
  bossActive=false; boss=null;
  setTimeout(()=>nextWave(), 1800);
}

function getPoints(type){ return {engine:10,transmission:20,oil:20,wrench:30,zero:40}[type]||10; }
function saveHi(){ if(score>hiScore){ hiScore=score; localStorage.setItem('fleetInvadersHi',String(hiScore)); } }

/* ============================== DRAW ================================ */
function drawPlayerBullet(b){
  ctx.save();
  if(b.trail&&b.trail.length>1){
    for(let i=0;i<b.trail.length-1;i++){
      const alpha=(i/b.trail.length)*0.65, width=5*(i/b.trail.length);
      ctx.globalAlpha=alpha; ctx.strokeStyle=C.limeGlow; ctx.lineWidth=width; ctx.lineCap='round';
      ctx.shadowBlur=8; ctx.shadowColor=C.lime;
      ctx.beginPath(); ctx.moveTo(b.trail[i].x,b.trail[i].y); ctx.lineTo(b.trail[i+1].x,b.trail[i+1].y); ctx.stroke();
    }
  }
  ctx.globalAlpha=1;
  ctx.shadowBlur=14; ctx.shadowColor=C.lime;
  ctx.fillStyle=C.white; ctx.fillRect(b.x-3,b.y-10,6,20);
  ctx.fillStyle=C.lime; ctx.fillRect(b.x-2,b.y-10,4,18);
  ctx.restore();
}
function drawEnemyBullet(b){
  ctx.save();
  if(b.type==='oil'){
    ctx.fillStyle='#995500'; ctx.beginPath(); ctx.ellipse(b.x,b.y,5,7,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#442200'; ctx.beginPath(); ctx.arc(b.x+2,b.y+4,3,0,Math.PI*2); ctx.fill();
  } else if(b.type==='wrench'){
    ctx.strokeStyle=C.orange; ctx.lineWidth=3; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(b.x-6,b.y); ctx.lineTo(b.x+6,b.y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(b.x,b.y-6); ctx.lineTo(b.x,b.y+6); ctx.stroke();
  } else if(b.type==='boss'){
    ctx.fillStyle=C.red; ctx.shadowBlur=10; ctx.shadowColor=C.red;
    ctx.beginPath(); ctx.arc(b.x,b.y,6,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#ff9900'; ctx.beginPath(); ctx.arc(b.x,b.y,3,0,Math.PI*2); ctx.fill();
  } else if(b.type==='dive'){
    ctx.fillStyle=C.orange; ctx.shadowBlur=10; ctx.shadowColor=C.orange;
    ctx.beginPath(); ctx.arc(b.x,b.y,5,0,Math.PI*2); ctx.fill();
  } else {
    ctx.fillStyle=C.orange; ctx.shadowBlur=7; ctx.shadowColor=C.orange;
    ctx.beginPath(); ctx.arc(b.x,b.y,4.5,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}
function drawEnemy(e){
  if(!e.alive) return;
  // telegraph
  if(e.telegraph>0){
    ctx.save(); ctx.globalAlpha=0.5;
    ctx.fillStyle=C.yellow; ctx.shadowBlur=15; ctx.shadowColor=C.yellow;
    ctx.beginPath(); ctx.arc(e.x,e.y,22,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
  if(e.deathFlash>0){
    ctx.save(); ctx.globalAlpha=e.deathFlash/0.15;
    ctx.fillStyle='#fff'; ctx.fillRect(e.x-22,e.y-22,44,44);
    ctx.restore();
  }
  switch(e.type){
    case 'engine':       drawEngineInvader(e.x,e.y,e.t,e.animFrame); break;
    case 'transmission': drawTransmission(e.x,e.y,e.t,e.animFrame);  break;
    case 'oil':          drawOilBarrel(e.x,e.y,e.t,e.animFrame);     break;
    case 'wrench':       drawWrench(e.x,e.y,e.t,e.animFrame);        break;
    case 'zero':         drawZeroDrone(e.x,e.y,e.t,e.animFrame);     break;
  }
}
function drawParticles(){
  particles.forEach(p=>{
    const a=p.life/p.maxLife;
    ctx.save(); ctx.globalAlpha=Math.max(0,a);
    if(p.type==='flash'){
      ctx.fillStyle='#fff'; ctx.shadowBlur=24; ctx.shadowColor='#fff';
      ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill();
    } else {
      ctx.fillStyle=p.color; ctx.shadowBlur=7; ctx.shadowColor=p.color;
      ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);
    }
    ctx.restore();
  });
}
function drawExhausts(){
  exhausts.forEach(p=>{
    const a=p.life/p.maxLife;
    ctx.save(); ctx.globalAlpha=a*0.7;
    ctx.fillStyle=C.limeDim;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill();
    ctx.restore();
  });
}
function drawScorePopups(){
  scorePopups.forEach(p=>{
    const a=p.life/p.maxLife;
    ctx.save(); ctx.globalAlpha=a;
    ctx.fillStyle=p.color;
    const sz = p.big ? 28 : (p.label.includes('x')?15:12);
    ctx.font=`bold ${sz}px Courier New`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.shadowBlur=p.big?20:8; ctx.shadowColor=p.color;
    ctx.fillText(p.label,p.x,p.y);
    ctx.restore();
  });
}

/* ============================== HUD ================================= */
function drawBusIcon(x,y,scale,color){
  ctx.save(); ctx.translate(x,y); ctx.scale(scale,scale);
  ctx.fillStyle='#0d1a00'; ctx.strokeStyle=color; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.roundRect(-14,-6,28,12,2); ctx.fill(); ctx.stroke();
  ctx.fillStyle=color; ctx.fillRect(-12,-6,24,2);
  ctx.fillStyle='rgba(180,255,100,0.6)';
  for(let i=0;i<3;i++) ctx.fillRect(-10+i*9,-3,7,4);
  ctx.fillStyle='#222'; ctx.beginPath(); ctx.arc(-8,7,2,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(8,7,2,0,Math.PI*2); ctx.fill();
  ctx.restore();
}
function drawHUD(){
  ctx.fillStyle='rgba(0,0,0,0.92)';
  ctx.fillRect(0,0,BASE_W,42);
  ctx.strokeStyle=C.lime; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(0,42); ctx.lineTo(BASE_W,42); ctx.stroke();

  // Score
  ctx.fillStyle=C.lime; ctx.font='bold 14px Courier New';
  ctx.textAlign='left'; ctx.fillText('SCORE '+String(displayScore).padStart(7,'0'), 12, 18);
  ctx.fillStyle=C.limeDim; ctx.font='bold 10px Courier New';
  ctx.fillText('HI '+String(hiScore).padStart(7,'0'), 12, 33);

  // Lives as bus icons (center)
  ctx.fillStyle=C.limeDim; ctx.font='bold 9px Courier New'; ctx.textAlign='center';
  ctx.fillText('FLEET', BASE_W/2, 11);
  for(let i=0;i<3;i++){
    const col = i<fleetHP ? C.lime : '#222';
    drawBusIcon(BASE_W/2 - 40 + i*40, 28, 1, col);
  }

  // Wave / Overdrive
  ctx.textAlign='right'; ctx.font='bold 14px Courier New';
  ctx.fillStyle = overdrive>0 ? C.orange : C.lime;
  const waveText = overdrive>0 ? `OVERDRIVE ${overdrive} • W${wave}` : `WAVE ${wave}/${TOTAL_WAVES}`;
  ctx.fillText(waveText, BASE_W-12, 18);

  // Active powerup as icon top-right under wave
  if(player.powerType){
    const col=POWERUP_COLORS[player.powerType]||C.lime;
    const px=BASE_W-72, py=30, w=60, h=8;
    ctx.fillStyle='#000'; ctx.fillRect(px,py,w,h);
    ctx.fillStyle=col; ctx.fillRect(px,py,w*(player.powerTimer/8),h);
    ctx.strokeStyle=col; ctx.lineWidth=1; ctx.strokeRect(px,py,w,h);
    ctx.fillStyle=col; ctx.font='bold 9px Courier New'; ctx.textAlign='right';
    ctx.fillText(POWERUP_LABELS[player.powerType], BASE_W-12, 39);
  }

  // Low HP warning
  if(fleetHP<=1){
    const warn=Math.sin(Date.now()*0.01)>0;
    if(warn){
      ctx.save(); ctx.globalAlpha=0.15; ctx.fillStyle=C.red; ctx.fillRect(0,0,BASE_W,BASE_H); ctx.restore();
    }
  }

  // Combo always visible
  if(combo>=1){
    const cc=combo>=10?C.red:combo>=5?C.orange:combo>=2?C.yellow:C.limeDim;
    ctx.fillStyle=cc; ctx.shadowBlur=combo>=2?10:0; ctx.shadowColor=cc;
    ctx.font=`bold ${10+Math.min(combo,12)}px Courier New`; ctx.textAlign='center';
    ctx.fillText('COMBO x'+combo, BASE_W/2, BASE_H-26);
    ctx.shadowBlur=0;
    // Timer bar
    if(combo>=2){
      ctx.fillStyle=cc; ctx.fillRect(BASE_W/2-30, BASE_H-22, 60*(comboTimer/2.6), 2);
    }
  }

  // Brand stamp
  ctx.fillStyle=C.limeDim; ctx.font='9px Courier New'; ctx.textAlign='left';
  ctx.fillText('BUS PULSE // FLEET DIVISION', 12, BASE_H-10);
  // Controls hint
  ctx.textAlign='right'; ctx.fillStyle=C.limeDim; ctx.font='9px Courier New';
  ctx.fillText('A/D MOVE  SPACE FIRE  P PAUSE  M MUSIC', BASE_W-12, BASE_H-10);
}

/* ============================== BORDER / BG ========================= */
function drawBorder(){
  ctx.shadowBlur=22; ctx.shadowColor=C.lime;
  ctx.strokeStyle=C.lime; ctx.lineWidth=3;
  ctx.strokeRect(2,2,BASE_W-4,BASE_H-4);
  ctx.shadowBlur=0;
  ctx.strokeStyle=C.limeDim; ctx.lineWidth=1;
  ctx.strokeRect(6,6,BASE_W-12,BASE_H-12);
  const corners=[[0,0,1,1],[BASE_W,0,-1,1],[0,BASE_H,1,-1],[BASE_W,BASE_H,-1,-1]];
  ctx.strokeStyle=C.lime; ctx.lineWidth=2;
  corners.forEach(([cx,cy,sx,sy])=>{
    ctx.beginPath(); ctx.moveTo(cx+sx*2,cy+sy*20); ctx.lineTo(cx+sx*2,cy+sy*2); ctx.lineTo(cx+sx*20,cy+sy*2); ctx.stroke();
  });
}
function drawStarsParallax(){
  ctx.fillStyle='rgba(255,255,255,0.35)';
  stars1.forEach(s=>{ const y=(s.y+starScroll1)%BASE_H; ctx.fillRect(s.x,y,s.s,s.s); });
  ctx.fillStyle='rgba(255,255,255,0.7)';
  stars2.forEach(s=>{ const y=(s.y+starScroll2)%BASE_H; ctx.fillRect(s.x,y,s.s,s.s); });
}
function drawGarageFloor(){
  // Horizon
  ctx.strokeStyle='#1a2a00'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(0,BASE_H-70); ctx.lineTo(BASE_W,BASE_H-70); ctx.stroke();
  // Perspective grid
  ctx.strokeStyle='rgba(166,255,0,0.10)'; ctx.lineWidth=1;
  const horizonY=BASE_H-70, vp=BASE_W/2;
  for(let i=-6;i<=6;i++){
    ctx.beginPath(); ctx.moveTo(vp+i*80, horizonY); ctx.lineTo(vp+i*250, BASE_H); ctx.stroke();
  }
  for(let i=1;i<=5;i++){
    const y=horizonY + (BASE_H-horizonY)*(i/5)*(i/5);
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(BASE_W,y); ctx.stroke();
  }
}
function drawScanlines(){
  ctx.save(); ctx.globalAlpha=0.04; ctx.fillStyle='#000';
  for(let y=0;y<BASE_H;y+=2) ctx.fillRect(0,y,BASE_W,1);
  ctx.restore();
}
function drawVignette(){
  const g=ctx.createRadialGradient(BASE_W/2,BASE_H/2,BASE_H*0.35,BASE_W/2,BASE_H/2,BASE_H*0.8);
  g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,0.55)');
  ctx.fillStyle=g; ctx.fillRect(0,0,BASE_W,BASE_H);
}

/* ============================== SCREENS ============================= */
function drawTitle(){
  ctx.fillStyle='#000'; ctx.fillRect(0,0,BASE_W,BASE_H);
  drawStarsParallax(); drawVignette(); drawBorder();
  const t=performance.now()*0.001;

  // Wordmark box
  ctx.strokeStyle=C.lime; ctx.lineWidth=2; ctx.shadowBlur=18; ctx.shadowColor=C.lime;
  ctx.strokeRect(BASE_W/2-260, 80, 520, 150);
  ctx.shadowBlur=0;
  ctx.textAlign='center';
  ctx.font='bold 64px Courier New';
  ctx.fillStyle=C.white; ctx.fillText('FLEET',BASE_W/2,148);
  ctx.shadowBlur=24; ctx.shadowColor=C.lime;
  ctx.fillStyle=C.lime; ctx.fillText('INVADERS',BASE_W/2,212);
  ctx.shadowBlur=0;
  ctx.fillStyle=C.limeDim; ctx.font='bold 11px Courier New';
  ctx.fillText('— A BUS PULSE PRODUCTION —', BASE_W/2, 250);

  // Demo enemies + points
  const demo=[{type:'engine',pts:'10'},{type:'transmission',pts:'20'},{type:'oil',pts:'20'},{type:'wrench',pts:'30'},{type:'zero',pts:'40'}];
  demo.forEach((d,i)=>{
    const ex=100+i*130, ey=305;
    drawEnemy({type:d.type,x:ex,y:ey,alive:true,t,animFrame:Math.floor(t*2)%2,telegraph:0,deathFlash:0});
    ctx.fillStyle=C.limeDim; ctx.font='8px Courier New'; ctx.textAlign='center';
    ctx.fillText('= '+d.pts+' PTS',ex,ey+32);
  });

  // Bus preview
  ctx.save(); ctx.translate(BASE_W/2,400); ctx.scale(1.2,1.2); drawBus(0,0,1,Math.sin(t*1.5)*0.04,0); ctx.restore();

  ctx.fillStyle=C.white; ctx.font='bold 17px Courier New'; ctx.textAlign='center';
  ctx.fillText('PRESS SPACE OR CLICK TO START',BASE_W/2,470);
  if(Math.floor(t*2)%2===0){
    ctx.fillStyle=C.lime; ctx.font='11px Courier New';
    ctx.fillText('A/D OR MOUSE TO MOVE   •   SPACE / CLICK TO FIRE   •   P PAUSE',BASE_W/2,495);
  }
  ctx.fillStyle=C.yellow; ctx.font='bold 14px Courier New';
  ctx.fillText('HI SCORE: '+String(hiScore).padStart(7,'0'), BASE_W/2, 525);
  ctx.fillStyle=C.limeDim; ctx.font='10px Courier New';
  ctx.fillText('SURVIVE 6 WAVES — THEN ENTER OVERDRIVE', BASE_W/2, 555);
  ctx.fillStyle=C.limeDim; ctx.font='9px Courier New';
  ctx.fillText('BUS PULSE FLEET MAINTENANCE DIVISION — SYSTEM ONLINE',BASE_W/2,BASE_H-16);
}

function drawPause(){
  ctx.fillStyle='rgba(0,0,0,0.78)'; ctx.fillRect(0,0,BASE_W,BASE_H);
  ctx.strokeStyle=C.lime; ctx.lineWidth=2.5;
  ctx.strokeRect(BASE_W/2-160,BASE_H/2-110,320,220);
  ctx.fillStyle=C.lime; ctx.font='bold 30px Courier New'; ctx.textAlign='center';
  ctx.fillText('PAUSED',BASE_W/2,BASE_H/2-60);
  ctx.fillStyle=C.white; ctx.font='12px Courier New';
  ctx.fillText('SCORE  '+score,BASE_W/2,BASE_H/2-28);
  ctx.fillText('WAVE   '+wave+(overdrive>0?'  (OVERDRIVE '+overdrive+')':''),BASE_W/2,BASE_H/2-10);
  ctx.fillText('KILLS  '+stats.kills,BASE_W/2,BASE_H/2+8);
  const acc = stats.shots>0 ? Math.round(stats.hits/stats.shots*100) : 0;
  ctx.fillText('ACC    '+acc+'%',BASE_W/2,BASE_H/2+26);
  ctx.fillStyle=C.limeDim; ctx.font='11px Courier New';
  ctx.fillText('P  RESUME   •   R  RESTART   •   M  MUSIC',BASE_W/2,BASE_H/2+76);
}

function drawGameOver(){
  ctx.fillStyle='rgba(0,0,0,0.9)'; ctx.fillRect(0,0,BASE_W,BASE_H);
  ctx.strokeStyle=C.red; ctx.lineWidth=2.5;
  ctx.strokeRect(BASE_W/2-220,BASE_H/2-150,440,300);
  ctx.fillStyle=C.red; ctx.shadowBlur=24; ctx.shadowColor=C.red;
  ctx.font='bold 42px Courier New'; ctx.textAlign='center';
  ctx.fillText('GARAGE DOWN',BASE_W/2,BASE_H/2-94);
  ctx.shadowBlur=0;
  ctx.fillStyle=C.white; ctx.font='bold 22px Courier New';
  ctx.fillText('SCORE  '+score, BASE_W/2, BASE_H/2-50);
  if(score===hiScore && score>0){
    ctx.fillStyle=C.yellow; ctx.font='bold 13px Courier New';
    ctx.fillText('!! NEW HI SCORE !!', BASE_W/2, BASE_H/2-26);
  } else {
    ctx.fillStyle=C.limeDim; ctx.font='12px Courier New';
    ctx.fillText('HI '+hiScore, BASE_W/2, BASE_H/2-26);
  }
  // Summary
  const elapsed = Math.floor((performance.now()-stats.startTime)/1000);
  const acc = stats.shots>0 ? Math.round(stats.hits/stats.shots*100) : 0;
  ctx.fillStyle=C.lime; ctx.font='13px Courier New'; ctx.textAlign='left';
  const lx=BASE_W/2-150;
  ctx.fillText('WAVES CLEARED   '+stats.waves, lx, BASE_H/2);
  ctx.fillText('ENEMIES KILLED  '+stats.kills, lx, BASE_H/2+22);
  ctx.fillText('ACCURACY        '+acc+'%', lx, BASE_H/2+44);
  ctx.fillText('LONGEST COMBO   x'+longestCombo, lx, BASE_H/2+66);
  ctx.fillText('POWER-UPS       '+stats.powerups, lx, BASE_H/2+88);
  ctx.fillText('TIME ALIVE      '+elapsed+'s', lx, BASE_H/2+110);
  ctx.textAlign='center';
  ctx.fillStyle=C.lime; ctx.font='13px Courier New';
  ctx.fillText('PRESS R OR CLICK TO REDEPLOY',BASE_W/2,BASE_H/2+140);
}

function drawVictory(){
  ctx.fillStyle='rgba(0,0,0,0.9)'; ctx.fillRect(0,0,BASE_W,BASE_H);
  ctx.strokeStyle=C.lime; ctx.lineWidth=2.5;
  ctx.strokeRect(BASE_W/2-200,BASE_H/2-110,400,220);
  ctx.fillStyle=C.lime; ctx.shadowBlur=24; ctx.shadowColor=C.lime;
  ctx.font='bold 46px Courier New'; ctx.textAlign='center';
  ctx.fillText('FLEET SAVED!',BASE_W/2,BASE_H/2-40);
  ctx.shadowBlur=0;
  ctx.fillStyle=C.white; ctx.font='18px Courier New';
  ctx.fillText('FINAL SCORE: '+score,BASE_W/2,BASE_H/2+14);
  ctx.fillStyle=C.yellow; ctx.font='13px Courier New';
  ctx.fillText('PRESS R OR CLICK TO PLAY AGAIN',BASE_W/2,BASE_H/2+60);
}

function drawWaveIntro(){
  const names=['','ENGINE ATTACK','TRANSMISSION SWARM','OIL BARREL DROP','WRENCH BRIGADE','ZERO FAULT INVASION','BROKEN ELEVATOR'];
  const t=performance.now()*0.001;
  const pulse=Math.sin(t*5)*0.15+0.85;
  ctx.fillStyle='rgba(0,0,0,0.7)'; ctx.fillRect(0,0,BASE_W,BASE_H);
  ctx.strokeStyle=C.lime; ctx.lineWidth=2.5; ctx.shadowBlur=18; ctx.shadowColor=C.lime;
  ctx.strokeRect(BASE_W/2-240,BASE_H/2-80,480,160);
  ctx.shadowBlur=0;
  ctx.fillStyle='rgba(0,20,0,0.85)'; ctx.fillRect(BASE_W/2-238,BASE_H/2-78,476,156);
  ctx.textAlign='center';
  ctx.fillStyle=C.limeDim; ctx.font='bold 13px Courier New';
  const label = overdrive>0 ? `— OVERDRIVE ${overdrive}  •  WAVE ${wave} —` : `— INCOMING WAVE ${wave} OF ${TOTAL_WAVES} —`;
  ctx.fillText(label,BASE_W/2,BASE_H/2-48);
  ctx.fillStyle=C.white; ctx.shadowBlur=10*pulse; ctx.shadowColor=C.lime;
  ctx.font='bold 26px Courier New';
  const nm = overdrive>0 ? 'OVERDRIVE RUN' : (names[wave]||'UNKNOWN');
  ctx.fillText(nm,BASE_W/2,BASE_H/2-12);
  ctx.shadowBlur=0;
  if(wave===6 && overdrive===0){
    ctx.fillStyle=Math.floor(t*3)%2===0?C.red:'#800';
    ctx.font='bold 14px Courier New';
    ctx.fillText('!!! BOSS INCOMING !!!',BASE_W/2,BASE_H/2+18);
  } else {
    ctx.fillStyle=C.limeDim; ctx.font='11px Courier New';
    ctx.fillText('GET READY...',BASE_W/2,BASE_H/2+22);
  }
  // Difficulty bar
  const dl = Math.min(1, (wave + overdrive*6)/6);
  ctx.fillStyle='#111'; ctx.fillRect(BASE_W/2-100,BASE_H/2+40,200,6);
  ctx.fillStyle=overdrive>0?C.red:(wave>=5?C.red:wave>=3?C.orange:C.lime);
  ctx.fillRect(BASE_W/2-100,BASE_H/2+40,200*dl,6);
  ctx.strokeStyle='#444'; ctx.lineWidth=1; ctx.strokeRect(BASE_W/2-100,BASE_H/2+40,200,6);
  ctx.fillStyle='#555'; ctx.font='8px Courier New'; ctx.textAlign='center';
  ctx.fillText('THREAT LEVEL',BASE_W/2,BASE_H/2+58);
}

/* ============================== RENDER ============================== */
function render(){
  ctx.clearRect(0,0,BASE_W,BASE_H);
  ctx.save(); ctx.translate(shakeX,shakeY);
  ctx.fillStyle='#000'; ctx.fillRect(0,0,BASE_W,BASE_H);
  drawStarsParallax();

  if(gs===STATE.TITLE){ ctx.restore(); drawTitle(); drawScanlines(); return; }
  if(gs===STATE.GAMEOVER){ ctx.restore(); drawGameOver(); drawScanlines(); return; }
  if(gs===STATE.VICTORY){ ctx.restore(); drawVictory(); drawScanlines(); return; }

  drawGarageFloor();
  drawExhausts();
  enemies.forEach(drawEnemy);
  if(bossActive&&boss) drawBoss(boss,boss.t);
  drawShields();

  if(player.alive){
    const vis=player.invincible<=0||Math.floor(player.invincible*8)%2===0;
    if(vis) drawBus(player.x,player.y,1,player.tilt,player.recoil);
  }

  playerBullets.forEach(drawPlayerBullet);
  enemyBullets.forEach(drawEnemyBullet);
  if(bonusDrone) drawDrone(bonusDrone);
  powerups.forEach(drawPowerup);
  drawParticles();
  drawScorePopups();

  ctx.restore();
  drawVignette();
  drawHUD(); drawBorder();
  drawScanlines();
  if(gs===STATE.PAUSED) drawPause();
  if(gs===STATE.WAVE_INTRO) drawWaveIntro();
}

/* ============================== LOOP ================================ */
function loop(ts){
  const dt=Math.min((ts-lastTime)/1000,0.033);
  lastTime=ts;
  ctx.setTransform(scale,0,0,scale,0,0);
  update(dt); render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(ts=>{ lastTime=ts; requestAnimationFrame(loop); });
</script>
</body>
